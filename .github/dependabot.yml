# ============================================================
#  Dependabot — GitHub'ın ücretsiz bağımlılık güncelleme botu
#
#  NE YAPAR?
#  Kullandığın paketleri (NuGet, GitHub Actions, npm, Docker)
#  düzenli olarak tarar, yeni sürüm çıkınca SENİN ADINA PR açar.
#
#  NEDEN GEREKLİ?
#  1) GÜVENLİK: paketlerde açık (CVE) bulunur. Elle takip etmek
#     imkansız; bot 3 saat içinde haber verir.
#  2) BİRİKME SORUNU: 6 ay güncellemezsen 40 paket birden eskir
#     ve hepsini aynı anda yükseltmek cehennem olur. Haftada
#     2 küçük PR, 6 ayda bir felaket yerine.
#
#  Bu dosya .github/ klasöründe OLMAK ZORUNDA - GitHub buraya bakar.
# ============================================================

version: 2

updates:
  # ----------------------------------------------------------
  # 1) NUGET — .NET paketleri
  # ----------------------------------------------------------
  - package-ecosystem: "nuget"
    # "/" = deponun kökünden başlayarak tüm .csproj dosyalarını tara.
    # Faz 0'da henüz proje yok; bot bir şey bulamaz, sorun değil.
    directory: "/"

    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Istanbul"

    # Aynı anda en fazla 5 açık PR. Sınır olmasa bot 30 PR açıp
    # seni boğabilir.
    open-pull-requests-limit: 5

    # DİKKAT: Buradaki etiketler repo'da ÖNCEDEN var olmak zorunda.
    # Dependabot etiketi kendisi OLUŞTURMAZ; bulamazsa PR'da
    # "the following labels could not be found: dependencies" der ve
    # etiketlemeden geçer. GitHub'ın varsayılan etiketleri arasında
    # 'dependencies' yok, bu yüzden repo ayarlarından elle eklendi.
    labels:
      - "dependencies"

    # Bot'un commit mesajları da Conventional Commits'e uysun.
    # Yoksa otomatik CHANGELOG üretimimiz bozulur.
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

    # GRUPLAMA: küçük güncellemeleri TEK PR'da birleştir.
    # 12 ayrı PR yerine 1 PR -> gözden geçirme yükü düşer.
    # Major sürümler gruba girmez; onlar tek tek gelir çünkü
    # breaking change içerebilir ve ayrıca incelenmeli.
    groups:
      dotnet-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ----------------------------------------------------------
  # 2) GITHUB ACTIONS — CI/CD adımlarının sürümleri
  #
  # Workflow'larda "uses: actions/checkout@v4" gibi satırlar var.
  # Bunlar da eskir ve GÜVENLİK AÇISINDAN KRİTİK: bir action
  # zararlı hale gelirse doğrudan CI ortamında kod çalıştırır
  # (secret'larına erişebilir). Güncel tutmak şart.
  # ----------------------------------------------------------
  - package-ecosystem: "github-actions"
    # Actions için "/" demek ".github/workflows" demektir.
    directory: "/"

    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Istanbul"

    open-pull-requests-limit: 3

    labels:
      - "dependencies"

    commit-message:
      prefix: "chore(ci)"

    # GRUPLAMA — NuGet bölümüyle AYNI kurallara çekildi.
    #
    # BURADA BİR YAPILANDIRMA HATASI VARDI (2026-10-12'de düzeltildi):
    # update-types filtresi yoktu, bu yüzden MAJOR atlamalar da gruba
    # giriyordu. Sonuç: tek bir PR'da üç major atlama birden geldi
    # (checkout v4->v7, setup-dotnet v4->v6, cache v4->v6).
    #
    # Neden sorun: major atlama kırıcı değişiklik içerebilir. Üçü aynı
    # PR'da gelirse CI kırıldığında hangisinin suçlu olduğu belirsiz
    # kalır ve tek tek denemek için PR'ı elle parçalamak gerekir.
    #
    # Artık NuGet'te olduğu gibi: küçük güncellemeler tek PR'da
    # birleşir, major'lar ayrı ayrı gelir ve tek tek değerlendirilir.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

# ============================================================
#  SONRA EKLENECEKLER (henüz o dosyalar yok - YAGNI):
#
#  - package-ecosystem: "docker"     -> Faz 1, Dockerfile yazınca
#    directory: "/src/Services/Identity"
#
#  - package-ecosystem: "npm"        -> Faz 9, React arayüzünde
#    directory: "/src/Web"
# ============================================================
